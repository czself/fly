[platformio]
default_envs = demo00_template
src_dir = src

[env]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube

build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -Isrc/hal/Inc

lib_ldf_mode = off
lib_compat_mode = off
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

# 板载自动 ISP 电路：CH340 的 RTS# 经 R60(1K) 驱动 Q8(S8550) 反相，
# 再经 R61(1K) 拉高 BOOT0；DTR 脉冲产生 NRST。
# 因为 Q8 反相，本板 RTS# 释放(高)才等于 BOOT0 高，所以下面的顺序与
# RCB6412 那套正好相反，已在本板实测下载成功，不要换回原来的写法。
upload_protocol = serial
upload_flags =
    -R
    -i
    -rts,-dtr,dtr:rts,-dtr,dtr

# -R 让 stm32flash 在写完固件后执行 GPIO 序列里 ':' 后面的退出序列，
# 即释放 RTS（Q8 导通把 BOOT0 拉低）并复位。没有 -R 的话板子写完仍停在
# 系统 bootloader 里，不会跳去运行刚写的程序，必须再按一下复位键。

# CH340 会反复掉线重插，内核每次重新分配 ttyUSB 编号（ttyUSB0 / ttyUSB1 ...），
# 所以不能写死端口。改成按 CH340 的 USB VID 自动定位：
# 既避开枚举号变化，也避开本机大量 /dev/ttyS* 传统串口被误选的问题。
extra_scripts = pre:extra_scripts/ch340_port.py

[env:demo00_template]
# 只用于验证工程骨架；每个正式例程都有独立环境，且只包含一个 demo 目录。
build_src_filter =
    +<hal/Src/**>
    -<demo/**>
    +<demo/00_template/**>

[env:demo01_gpio_led]
build_src_filter =
    +<hal/Src/**>
    -<demo/**>
    +<demo/01_gpio_led/**>

[env:demo02_key_led]
build_src_filter =
    +<hal/Src/**>
    -<demo/**>
    +<demo/02_key_led/**>

[env:demo05_i2c_scan]
build_src_filter =
    +<hal/Src/**>
    -<demo/**>
    +<demo/05_i2c_scan/**>

; ---------------------------------------------------------------------------
; 板载只读自检：检查供电、按键、LED、I2C、IMU、气压计、ADC和DAC。
; ---------------------------------------------------------------------------
; EEPROM只做地址探测；默认不写存储、不编译电机PWM测试。
[env:demo_selftest]
build_src_filter =
    +<hal/Src/**>
    -<hal/Src/tim.c>
    -<demo/**>
    +<demo/demo_selftest/**>

; VOFA+ 实时传感器遥测：115200 8N1 / JustFloat / 50 Hz。
[env:demo_vofa]
build_src_filter =
    +<hal/Src/**>
    -<demo/**>
    +<demo/demo_vofa/**>

; 最小串口诊断，排除 HSE / HAL 时间基准 / 传感器，输出 ASCII 心跳。
[env:demo_uart_probe]
build_src_filter =
    +<demo/demo_uart_probe/**>
upload_flags =
    ${env.upload_flags}
    -v

; 教学系列：每次只构建/烧录一个环境。01 复用已实机使用的遥测源码。
[env:demo01_vofa]
extends = env:demo_vofa

; 遥控接收 USART1=9600，日志 UART4=115200（JP14，外接 3.3 V USB-TTL）。
[env:demo02_remote]
build_flags =
    ${env.build_flags}
    -Isrc/flight
    -DUSART1_DEMO_BAUDRATE=9600U
build_src_filter =
    +<hal/Src/**>
    +<flight/remote.c>
    +<flight/radio.c>
    +<demo/demo02_remote/**>

; 默认仅演示按键门控/遥测，实际电机占空比始终为 0。
[env:demo03_motor]
build_flags =
    ${env.build_flags}
    -Isrc/flight
build_src_filter =
    +<hal/Src/**>
    +<flight/motor_guard.c>
    +<demo/demo03_motor/**>

; 拆桨单电机台架版：长按 KEY1 2 秒后 15%，松手/KEY2/3 秒超时停机。
; 默认测试 M1；其他通道修改 MOTOR_TEST_INDEX（M5 禁用）。不属于飞行固件。
[env:demo03_motor_bench]
extends = env:demo03_motor
build_flags =
    ${env:demo03_motor.build_flags}
    -DMOTOR_BENCH_ENABLE=1
    -DMOTOR_TEST_INDEX=1U
    -DBOARD_TIM3_PERIOD_US=66U
    -DBOARD_TIM4_PERIOD_US=66U

; 软件悬停模型：输入/四路电机需求均为虚拟值，物理 PWM 始终未启动。
[env:demo04_hover_logic]
build_flags =
    ${env.build_flags}
    -Isrc/flight
build_src_filter =
    +<hal/Src/**>
    +<flight/pid.c>
    +<flight/hover.c>
    +<flight/hover_sim.c>
    +<demo/demo04_hover_logic/**>

; 正点原子 ATK-PMW3901 4m：VL53L1X 测距（I2C2，0x29）和 PMW3901（SPI2）。
[env:demo05_tof]
build_flags =
    ${env.build_flags}
    -Isrc/flight
    -Isrc/sensors
build_src_filter =
    +<hal/Src/**>
    +<sensors/tof.c>
    +<sensors/f22_sensor_bus.c>
    +<flight/observation.c>
    +<demo/demo05_tof/**>

[env:demo06_flow]
extends = env:demo05_tof
build_src_filter =
    +<hal/Src/**>
    +<sensors/tof.c>
    +<sensors/flow.c>
    +<sensors/f22_sensor_bus.c>
    +<demo/demo06_flow/**>

; 实际传感器 + 控制器预览；所有实际 PWM 始终为零，无飞行输出开关。
[env:demo07_integration]
extends = env:demo05_tof
build_src_filter =
    +<hal/Src/**>
    +<sensors/tof.c>
    +<sensors/flow.c>
    +<sensors/f22_sensor_bus.c>
    +<flight/observation.c>
    +<flight/pid.c>
    +<flight/hover.c>
    +<demo/demo07_integration/**>

; 必须与 remote/tle100/main.c 的新协议发射端配套，原厂字符固件不兼容。
[env:demo02_remote_framed]
extends = env:demo02_remote
build_flags =
    ${env:demo02_remote.build_flags}
    -DF22_REMOTE_FRAMED=1
