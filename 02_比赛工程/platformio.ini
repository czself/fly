[platformio]
default_envs = contest_hover
src_dir = src

[env:contest_hover]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=9600U
    -DUSART4_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -Isrc/sensors
    -Isrc/flight
build_src_filter =
    +<main.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/i2c.c>
    +<hal/Src/sensors.c>
    +<hal/Src/stm32f1xx_it.c>
    +<sensors/*.c>
    +<flight/*.c>
lib_ldf_mode = off
lib_compat_mode = off
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
; F22 CH340 automatic ISP: keep the board-verified RTS/DTR sequence.
upload_protocol = serial
upload_flags =
    -R
    -i
    -rts,-dtr,dtr:rts,-dtr,dtr
extra_scripts = pre:extra_scripts/ch340_port.py
